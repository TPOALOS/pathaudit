[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pathaudit"
version = "1.0.0"
description = "Audit your PATH for current-dir hijack, writable or foreign-owned directories, symlinks, duplicates and shadowed commands. Read-only. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["security", "path", "hardening", "audit", "cli", "sysadmin"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/pathaudit"

[project.scripts]
pathaudit = "pathaudit:main"

[tool.setuptools]
py-modules = ["pathaudit"]
